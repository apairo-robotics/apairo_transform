[project]
name = "apairo-transform"
version = "0.2.0"
description = "Runtime transforms for apairo datasets"
dependencies = [
    "numpy",
    "apairo>=0.6",
]

[project.optional-dependencies]
# Resize (apairo_transform.image) needs OpenCV, and to_torch needs PyTorch; the
# rest is pure numpy. Kept optional so the core install stays numpy-only.
image = ["opencv-python"]
torch = ["torch"]
dev = ["pytest", "opencv-python", "torch"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
