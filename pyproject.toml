[project]
name = "apairo-transform"
version = "0.1.0"
description = "Runtime transforms for apairo datasets"
dependencies = [
    "numpy",
    "apairo",
]

[project.optional-dependencies]
# Resize (apairo_transform.image) needs OpenCV; the other image transforms are
# pure numpy. Kept optional so the core install stays numpy-only.
image = ["opencv-python"]
dev = ["pytest", "opencv-python"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
