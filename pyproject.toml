[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apairo-transform"
version = "0.3.1"
description = "Runtime transforms for apairo datasets: point clouds, images, labels, poses"
readme = "README.md"
authors = [
  { name = "Augustin Bresset", email = "augustin.bresset@gmail.com" },
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["apairo", "lidar", "point-cloud", "augmentation", "robotics"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "apairo>=0.9",
]

[project.urls]
Homepage = "https://apairo-robotics.github.io/"
Repository = "https://github.com/apairo-robotics/apairo_transform"
Issues = "https://github.com/apairo-robotics/apairo_transform/issues"

[project.optional-dependencies]
# Resize (apairo_transform.image) needs OpenCV, and to_torch needs PyTorch; the
# rest is pure numpy. Kept optional so the core install stays numpy-only.
image = ["opencv-python"]
torch = ["torch"]
dev = ["pytest", "opencv-python", "torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apairo_transform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
